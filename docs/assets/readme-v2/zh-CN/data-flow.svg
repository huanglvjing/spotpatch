<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">组件与接口，关系有据可循。</title><desc id="desc">SpotPatch 规范重绘与立体概念展示。基于项目功能，不是实际运行截图。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#151723"/><stop offset="1" stop-color="#080a11"/></linearGradient><linearGradient id="glass" x2=".4" y2="1"><stop stop-color="#292b3b"/><stop offset="1" stop-color="#10131d"/></linearGradient><linearGradient id="violet"><stop stop-color="#8253f4"/><stop offset="1" stop-color="#6240df"/></linearGradient><linearGradient id="rim"><stop stop-color="#c1abff"/><stop offset=".5" stop-color="#4f4372"/><stop offset="1" stop-color="#7caec6"/></linearGradient><linearGradient id="slab" x2=".7" y2="1"><stop stop-color="#393947"/><stop offset="1" stop-color="#171924"/></linearGradient><filter id="shadow" x="-60%" y="-60%" width="220%" height="240%"><feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000" flood-opacity=".3"/></filter></defs><g font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="url(#bg)" stroke="none"/><g transform="translate(64 42)"><svg
