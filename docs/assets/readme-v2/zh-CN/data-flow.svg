</g><text x="885" y="218" font-size="21" font-weight="650" fill="#edf0fa">SpotPatch</text><text x="885" y="241" font-size="12" font-weight="400" fill="#a5a8ba">页面上下文工作台</text><text x="1204" y="221" font-size="12" font-weight="400" fill="#b8bccd">中 / EN</text><text x="1268" y="221" font-size="23" font-weight="400" fill="#b8bccd">×</text><path d="M832 264 H1288" stroke="#343744"/><text x="834" y="301" font-size="23" font-weight="650" fill="#edf0fa">组件数据链路</text><text x="1183" y="301" font-size="12" font-weight="650" fill="#b69eff">BETA</text><text x="834" y="333" font-size="13" font-weight="400" fill="#9da5b8">ProductCard / 示例报告</text><rect x="834" y="356" width="452" height="57" rx="10" fill="#171b27" stroke="#303646"/><text x="852" y="380" font-size="12" font-weight="400" fill="#969fb3">组件身份</text><text x="984" y="390" font-size="14" font-weight="400" fill="#d4d8e5">ProductCard</text><rect x="834" y="424" width="452" height="57" rx="10" fill="#171b27" stroke="#303646"/><text x="852" y="448" font-size="12" font-weight="400" fill="#969fb3">调用证据</text><text x="984" y="458" font-size="14" font-weight="400" fill="#d4d8e5">组件 → service → fetch</text><rect x="834" y="492" width="452" height="57" rx="10" fill="#171b27" stroke="#303646"/><text x="852" y="516" font-size="12" font-weight="400" fill="#969fb3">请求</text><text x="984" y="526" font-size="14" font-weight="400" fill="#d4d8e5">GET /api/products</text><rect x="834" y="560" width="452" height="57" rx="10" fill="#171b27" stroke="#303646"/><text x="852" y="584" font-size="12" font-weight="400" fill="#969fb3">响应消费字段</text><text x="984" y="594" font-size="14" font-weight="400" fill="#d4d8e5">name · image · price</text><rect x="834" y="628" width="452" height="57" rx="10" fill="#171b27" stroke="#303646"/><text x="852" y="652" font-size="12" font-weight="400" fill="#969fb3">数据去向</text><text x="984" y="662" font-size="14" font-weight="400" fill="#d4d8e5">React state → 页面渲染</text><text x="834" y="731" font-size="13" font-weight="400" fill="#dbbf87">证据不足时保持 unknown / unassigned。</text><rect x="834" y="753" width="452" height="42" rx="10" fill="#202430" stroke="#3c4051"/><text text-anchor="middle" x="1060.0" y="780" font-size="15" font-weight="550" fill="#f3efff">返回修改说明</text><text x="64" y="946" font-size="12" font-weight="400" fill="#8993a7">SPOTPATCH / VISUAL SYSTEM 02</text><text x="1000" y="946" font-size="12" font-weight="400" fill="#8993a7">460px 工作台规范的展示比例重绘</text></g></svg>