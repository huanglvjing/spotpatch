<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>SpotPatch · Minimal Dynamic Island</title>

    <!--
  SpotPatch Minimal Dynamic Island
  ==========================================
  设计原则：
  - 80% 系统感 / 15% SpotPatch 品牌 / 5% 光效
  - 默认只显示“此刻最重要的一件事”
  - 不做大图标容器、不做状态卡、不做假的百分比、不做常驻粒子
  - Compact / Expanded 使用同一个 shell 连续 morph
  - 常驻动画只使用 transform / opacity
  - Shell geometry 使用 GSAP
  - 事件状态使用真实 state 文案，不重复表达 working / executing
-->

    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>

    <style>
      :root {
        color-scheme: dark;
        --bg: #f5f7fb;
        --surface: #050608;
        --surface-2: #080a0e;
        --text: #f7f7fb;
        --muted: #8f949f;
        --subtle: #5f646e;
        --line: rgba(255, 255, 255, 0.1);
        --violet: #8b67ff;
        --blue: #6478ff;
        --cyan: #4dc8ff;
        --mint: #59dcb6;
        --error: #ef6f88;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Display",
          "SF Pro Text",
          "Segoe UI",
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
        background:
          radial-gradient(
            850px 380px at 50% -14%,
            rgba(116, 90, 255, 0.12),
            transparent 62%
          ),
          linear-gradient(180deg, #fafbfe 0%, #eff2f7 100%);
      }

      /* ---------- fake product page ---------- */
      .workspace {
        position: fixed;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(73, 80, 98, 0.05) 1px, transparent 1px) 0 0/96px
            96px,
          linear-gradient(rgba(73, 80, 98, 0.05) 1px, transparent 1px) 0 0/96px 96px;
      }
      .hero {
        position: absolute;
        left: 7%;
        right: 7%;
        top: 7%;
        height: 185px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.63);
        border: 1px solid rgba(28, 34, 48, 0.075);
        box-shadow: 0 16px 42px rgba(35, 42, 62, 0.04);
      }
      .hero:before,
      .hero:after {
        content: "";
        position: absolute;
        left: 36px;
        height: 16px;
        border-radius: 999px;
        background: #e4e7ef;
      }
      .hero:before {
        top: 42px;
        width: 270px;
      }
      .hero:after {
        top: 82px;
        width: 430px;
      }
      .tile-row {
        position: absolute;
        left: 7%;
        right: 7%;
        top: 235px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
      .tile {
        height: 160px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.58);
        border: 1px solid rgba(28, 34, 48, 0.065);
      }
      .brand-badge {
        position: fixed;
        left: 22px;
        top: 22px;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.76);
        border: 1px solid rgba(27, 32, 44, 0.075);
        backdrop-filter: blur(18px);
        color: #747a86;
        font-size: 12px;
        font-weight: 780;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }
      .brand-badge:before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--violet);
        box-shadow: 0 0 0 6px rgba(139, 103, 255, 0.12);
      }

      .controls {
        position: fixed;
        left: 50%;
        bottom: 24px;
        z-index: 4;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        padding: 6px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(29, 35, 48, 0.075);
        backdrop-filter: blur(18px);
        box-shadow: 0 10px 28px rgba(30, 38, 58, 0.06);
      }
      .controls button {
        height: 34px;
        padding: 0 12px;
        border-radius: 10px;
        border: 0;
        background: transparent;
        color: #666d7a;
        font-weight: 700;
        cursor: pointer;
      }
      .controls button:hover {
        background: rgba(33, 40, 55, 0.05);
      }
      .controls .accent {
        background: #11131a;
        color: #fff;
      }

      /* ---------- island ---------- */
      .island {
        --accent: 139, 103, 255;
        --accent2: 77, 200, 255;

        position: fixed;
        z-index: 20;
        left: 50%;
        top: 48%;
        width: min(440px, calc(100vw - 32px));
        height: 62px;
        transform: translate(-50%, -50%) translateZ(0);
        border-radius: 31px;
        overflow: hidden;
        isolation: isolate;

        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.028),
            rgba(255, 255, 255, 0) 24%
          ),
          rgba(5, 6, 8, 0.988);

        border: 1px solid rgba(255, 255, 255, 0.1);

        box-shadow:
          0 24px 60px rgba(13, 17, 28, 0.18),
          0 3px 10px rgba(13, 17, 28, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.065),
          inset 0 0 0 1px rgba(255, 255, 255, 0.012);

        will-change: width, height, border-radius, transform;
      }

      /* very subtle static ambient */
      .island:before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background:
          radial-gradient(
            180px 70px at 0% 50%,
            rgba(var(--accent), 0.07),
            transparent 72%
          ),
          radial-gradient(
            180px 70px at 100% 50%,
            rgba(var(--accent2), 0.045),
            transparent 72%
          );
        opacity: 0.82;
      }

      /* one-time sheen triggered per state change */
      .sheen {
        position: absolute;
        inset: -30% -20%;
        z-index: 6;
        pointer-events: none;
        opacity: 0;
        background: linear-gradient(
          108deg,
          transparent 0 42%,
          rgba(255, 255, 255, 0.015) 46%,
          rgba(255, 255, 255, 0.085) 50%,
          rgba(var(--accent2), 0.055) 53%,
          transparent 58%
        );
        transform: translateX(-62%);
      }

      /* compact layout */
      .compact {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 12px;
        padding: 0 18px;
      }

      .mark {
        width: 23px;
        height: 23px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        position: relative;
      }
      .mark svg {
        width: 22px;
        height: 22px;
        display: block;
        filter: drop-shadow(0 0 7px rgba(var(--accent), 0.16));
      }
      .mark .soft-dot {
        position: absolute;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        right: -1px;
        top: 1px;
        background: rgb(var(--accent2));
        opacity: 0;
        box-shadow: 0 0 8px rgba(var(--accent2), 0.45);
      }

      .copy {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .title {
        min-width: 0;
        color: var(--text);
        font-size: 15px;
        font-weight: 690;
        letter-spacing: -0.018em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .context {
        flex: none;
        color: #696f79;
        font-size: 11px;
        white-space: nowrap;
      }

      .meta {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: none;
        color: #989da8;
        font-size: 11px;
        font-weight: 620;
      }
      .state-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgb(var(--accent));
        box-shadow: 0 0 8px rgba(var(--accent), 0.38);
      }
      .timer {
        width: 34px;
        text-align: right;
        font:
          10px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: #737985;
      }
      .more {
        width: 24px;
        height: 24px;
        border: 0;
        background: none;
        color: #686e78;
        padding: 0;
        display: grid;
        place-items: center;
        cursor: pointer;
        font-size: 15px;
      }

      /* tiny signal at the very bottom, NOT a progress bar */
      .signal {
        position: absolute;
        left: 44px;
        right: 44px;
        bottom: 0;
        height: 1px;
        z-index: 3;
        overflow: hidden;
        opacity: 0;
      }
      .signal:before {
        content: "";
        position: absolute;
        top: 0;
        height: 1px;
        width: 18%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(var(--accent), 0.75),
          rgba(var(--accent2), 0.6),
          transparent
        );
        box-shadow: 0 0 7px rgba(var(--accent), 0.2);
        transform: translateX(-140%);
      }

      /* expanded */
      .expanded {
        position: absolute;
        inset: 0;
        z-index: 2;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        padding: 18px 20px 16px;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      .exp-head {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 12px;
      }
      .exp-title {
        color: #fff;
        font-size: 15px;
        font-weight: 690;
        letter-spacing: -0.018em;
      }
      .exp-sub {
        margin-top: 4px;
        color: #7d838e;
        font-size: 11px;
      }
      .close-detail {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 0;
        background: rgba(255, 255, 255, 0.045);
        color: #828894;
        cursor: pointer;
      }
      .events {
        margin-top: 16px;
        display: grid;
        gap: 0;
      }
      .event {
        min-height: 28px;
        display: grid;
        grid-template-columns: 52px 1fr auto;
        align-items: center;
        border-top: 1px solid rgba(255, 255, 255, 0.055);
        font-size: 11px;
      }
      .event:first-child {
        border-top: 0;
      }
      .event-kind {
        color: #666c76;
        font:
          10px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        text-transform: uppercase;
      }
      .event-text {
        color: #b2b6bf;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .event-status {
        color: #626974;
        font:
          10px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .event.active .event-kind {
        color: rgb(var(--accent));
      }
      .event.active .event-text {
        color: #f2f3f7;
      }
      .event.active .event-status {
        color: #a3a8b2;
      }

      /* state refinements */
      .island[data-state="receive"] .soft-dot {
        opacity: 0.8;
        animation: pulse 1.8s ease-in-out infinite;
      }
      .island[data-state="dispatch"] .soft-dot {
        opacity: 1;
        animation: pulse 0.9s ease-in-out infinite;
      }
      .island[data-state="running"] .soft-dot {
        opacity: 0.55;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.28;
          transform: scale(0.78);
        }
      }

      .island[data-state="done"] {
        --accent: 89, 220, 182;
        --accent2: 89, 220, 182;
      }
      .island[data-state="done"] .state-dot {
        background: rgb(var(--accent));
        box-shadow: 0 0 9px rgba(var(--accent), 0.34);
      }

      @media (max-width: 620px) {
        .context {
          display: none;
        }
        .timer {
          display: none;
        }
        .island {
          top: 44%;
        }
        .event {
          grid-template-columns: 48px 1fr;
        }
        .event-status {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .soft-dot {
          animation: none !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="workspace" aria-hidden="true">
      <div class="hero"></div>
      <div class="tile-row">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>
    </div>

    <div class="brand-badge">SpotPatch / Minimal Island</div>

    <section
      class="island"
      id="island"
      data-state="receive"
      aria-label="SpotPatch Agent 状态"
    >
      <div class="sheen" id="sheen"></div>

      <div class="compact" id="compact">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 28 28" fill="none">
            <defs>
              <linearGradient id="brandGrad" x1="4" y1="3" x2="24" y2="25">
                <stop stop-color="#9a70ff" />
                <stop offset=".55" stop-color="#6d70ff" />
                <stop offset="1" stop-color="#49c8ff" />
              </linearGradient>
            </defs>
            <path
              d="M9 8.5 4.8 14 9 19.5M19 8.5 23.2 14 19 19.5"
              stroke="url(#brandGrad)"
              stroke-width="2.1"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M15.8 6.5 12.1 21.3"
              stroke="url(#brandGrad)"
              stroke-width="2.1"
              stroke-linecap="round"
            />
          </svg>
          <i class="soft-dot"></i>
        </div>

        <div class="copy">
          <div class="title" id="title">正在接收上下文</div>
          <div class="context" id="context">2 个目标 · 14 个代码片段</div>
        </div>

        <div class="meta">
          <span class="state-dot"></span>
          <span id="stateText">接收中</span>
          <span class="timer" id="timer">00:00</span>
          <button class="more" id="moreBtn" aria-label="展开详情">•••</button>
        </div>
      </div>

      <div class="signal" id="signal"></div>

      <div class="expanded" id="expanded">
        <div class="exp-head">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 28 28" fill="none">
              <defs>
                <linearGradient id="brandGrad2" x1="4" y1="3" x2="24" y2="25">
                  <stop stop-color="#9a70ff" />
                  <stop offset=".55" stop-color="#6d70ff" />
                  <stop offset="1" stop-color="#49c8ff" />
                </linearGradient>
              </defs>
              <path
                d="M9 8.5 4.8 14 9 19.5M19 8.5 23.2 14 19 19.5"
                stroke="url(#brandGrad2)"
                stroke-width="2.1"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M15.8 6.5 12.1 21.3"
                stroke="url(#brandGrad2)"
                stroke-width="2.1"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <div>
            <div class="exp-title" id="expTitle">Codex 正在执行修改</div>
            <div class="exp-sub" id="expSub">ListFixture · src/fixtures.tsx:68</div>
          </div>
          <button class="close-detail" id="closeBtn" aria-label="收起">×</button>
        </div>

        <div class="events">
          <div class="event">
            <div class="event-kind">read</div>
            <div class="event-text">src/fixtures.tsx:68</div>
            <div class="event-status">done</div>
          </div>
          <div class="event active">
            <div class="event-kind">patch</div>
            <div class="event-text">ListFixture · 3 hunks</div>
            <div class="event-status">running</div>
          </div>
          <div class="event">
            <div class="event-kind">check</div>
            <div class="event-text">TypeScript</div>
            <div class="event-status">queued</div>
          </div>
        </div>
      </div>
    </section>

    <div class="controls">
      <button id="prev">←</button>
      <button class="accent" id="next">下一状态</button>
      <button id="detail">展开详情</button>
      <button id="replay">重播</button>
    </div>

    <script>
      (() => {
        if (!window.gsap) {
          document.body.insertAdjacentHTML(
            "beforeend",
            '<div style="position:fixed;left:20px;bottom:20px;background:#111;color:#fff;padding:10px 12px;border-radius:10px;z-index:99;font:12px system-ui">GSAP CDN 未加载，请联网打开 Demo。</div>',
          );
          return;
        }

        const $ = (q) => document.querySelector(q);

        const island = $("#island");
        const compact = $("#compact");
        const expanded = $("#expanded");
        const title = $("#title");
        const context = $("#context");
        const stateText = $("#stateText");
        const timerEl = $("#timer");
        const signal = $("#signal");
        const sheen = $("#sheen");
        const expTitle = $("#expTitle");
        const expSub = $("#expSub");

        const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const M = reduced ? 0.05 : 1;

        const states = [
          {
            id: "receive",
            width: 430,
            title: "正在接收上下文",
            context: "2 个目标 · 14 个代码片段",
            state: "接收中",
            expTitle: "正在接收上下文",
            expSub: "SpotPatch 正在整理你刚刚选中的目标",
          },
          {
            id: "dispatch",
            width: 448,
            title: "正在交接给 Codex",
            context: "上下文已封装",
            state: "派发中",
            expTitle: "正在交接给 Codex",
            expSub: "Context bundle → codex-app-server",
          },
          {
            id: "running",
            width: 468,
            title: "正在修改 ListFixture",
            context: "src/fixtures.tsx:68",
            state: "执行中",
            expTitle: "Codex 正在执行修改",
            expSub: "ListFixture · src/fixtures.tsx:68",
          },
          {
            id: "check",
            width: 440,
            title: "正在运行类型检查",
            context: "TypeScript",
            state: "检查中",
            expTitle: "正在运行类型检查",
            expSub: "验证本次修改是否引入类型错误",
          },
          {
            id: "done",
            width: 356,
            title: "修改完成",
            context: "2 files",
            state: "完成",
            expTitle: "修改已完成",
            expSub: "结果已回流 SpotPatch",
          },
        ];

        let index = 0;
        let isExpanded = false;
        let startedAt = performance.now();
        let timer = null;

        function wait(ms) {
          return new Promise((r) => setTimeout(r, reduced ? 10 : ms));
        }

        function restartTimer() {
          startedAt = performance.now();
          clearInterval(timer);
          timerEl.textContent = "00:00";
          timer = setInterval(() => {
            const sec = Math.floor((performance.now() - startedAt) / 1000);
            timerEl.textContent = "00:" + String(sec).padStart(2, "0");
          }, 1000);
        }

        function swap(el, value, delay = 0) {
          gsap
            .timeline({ delay: delay * M })
            .to(el, {
              duration: 0.11 * M,
              opacity: 0,
              y: -3,
              filter: "blur(2px)",
              ease: "power2.in",
            })
            .add(() => (el.textContent = value))
            .fromTo(
              el,
              { opacity: 0, y: 3, filter: "blur(2px)" },
              {
                duration: 0.22 * M,
                opacity: 1,
                y: 0,
                filter: "blur(0px)",
                ease: "power3.out",
              },
            );
        }

        function flashSheen() {
          gsap.killTweensOf(sheen);
          gsap.set(sheen, { xPercent: -10, opacity: 0 });
          gsap
            .timeline()
            .to(sheen, { duration: 0.1 * M, opacity: 0.56 })
            .to(
              sheen,
              {
                duration: 0.62 * M,
                xPercent: 112,
                opacity: 0.12,
                ease: "power2.inOut",
              },
              "<",
            )
            .to(sheen, { duration: 0.12 * M, opacity: 0 });
        }

        function signalOnce() {
          const bar = signal;
          gsap.killTweensOf(bar);
          gsap.set(bar, { opacity: 1 });
          const pseudo = { x: -140 };

          /* use CSS variable to animate the single beam without adding DOM noise */
          bar.style.setProperty("--beam-x", "-140%");

          const beam = document.createElement("i");
          beam.style.cssText = `
      position:absolute;top:0;height:1px;width:18%;
      background:linear-gradient(90deg,transparent,rgba(var(--accent),.75),rgba(var(--accent2),.58),transparent);
      box-shadow:0 0 7px rgba(var(--accent),.20);
      transform:translateX(-140%);
    `;
          bar.appendChild(beam);

          gsap.to(beam, {
            duration: 0.72 * M,
            xPercent: 760,
            ease: "power2.inOut",
            onComplete: () => {
              gsap.to(bar, { duration: 0.16 * M, opacity: 0 });
              beam.remove();
            },
          });
        }

        async function setState(next) {
          index = (next + states.length) % states.length;
          const s = states[index];
          island.dataset.state = s.id;

          if (isExpanded) await collapse();

          const w = Math.min(s.width, innerWidth - 32);

          gsap.to(island, {
            duration: 0.48 * M,
            width: w,
            height: 62,
            borderRadius: 31,
            ease: "expo.inOut",
            overwrite: true,
          });

          swap(title, s.title, 0);
          swap(context, s.context, 0.03);
          swap(stateText, s.state, 0.055);
          swap(expTitle, s.expTitle, 0);
          swap(expSub, s.expSub, 0.02);

          gsap.fromTo(
            ".state-dot",
            { scale: 0.72, opacity: 0.35 },
            { duration: 0.32 * M, scale: 1, opacity: 1, ease: "back.out(1.8)" },
          );

          if (s.id === "dispatch") {
            signalOnce();
            gsap.fromTo(
              ".mark",
              { x: -1 },
              { duration: 0.28 * M, x: 1, repeat: 1, yoyo: true, ease: "sine.inOut" },
            );
          }

          if (s.id === "done") {
            gsap.fromTo(
              ".mark svg",
              { scale: 0.92, opacity: 0.65 },
              { duration: 0.38 * M, scale: 1, opacity: 1, ease: "back.out(2)" },
            );
          }

          flashSheen();
          restartTimer();
        }

        async function expand() {
          if (isExpanded) return;
          isExpanded = true;

          const w = Math.min(520, innerWidth - 32);

          gsap.to(compact, {
            duration: 0.18 * M,
            opacity: 0,
            y: -5,
            filter: "blur(3px)",
            ease: "power2.in",
            onComplete: () =>
              gsap.set(compact, { visibility: "hidden", pointerEvents: "none" }),
          });

          gsap.set(expanded, { visibility: "visible", pointerEvents: "auto" });
          gsap.fromTo(
            expanded,
            { opacity: 0, y: 6, filter: "blur(4px)" },
            {
              duration: 0.3 * M,
              delay: 0.1 * M,
              opacity: 1,
              y: 0,
              filter: "blur(0px)",
              ease: "power3.out",
            },
          );

          gsap.to(island, {
            duration: 0.54 * M,
            width: w,
            height: 164,
            borderRadius: 30,
            ease: "expo.inOut",
            overwrite: true,
          });
        }

        async function collapse() {
          if (!isExpanded) return;
          isExpanded = false;
          const s = states[index];
          const w = Math.min(s.width, innerWidth - 32);

          gsap.to(expanded, {
            duration: 0.15 * M,
            opacity: 0,
            y: -4,
            filter: "blur(3px)",
            ease: "power2.in",
            onComplete: () =>
              gsap.set(expanded, { visibility: "hidden", pointerEvents: "none" }),
          });

          gsap.set(compact, { visibility: "visible", pointerEvents: "auto" });
          gsap.fromTo(
            compact,
            { opacity: 0, y: 4, filter: "blur(3px)" },
            {
              duration: 0.26 * M,
              delay: 0.1 * M,
              opacity: 1,
              y: 0,
              filter: "blur(0px)",
              ease: "power3.out",
            },
          );

          await gsap.to(island, {
            duration: 0.48 * M,
            width: w,
            height: 62,
            borderRadius: 31,
            ease: "expo.inOut",
            overwrite: true,
          });
        }

        $("#next").onclick = () => setState(index + 1);
        $("#prev").onclick = () => setState(index - 1);
        $("#detail").onclick = () => (isExpanded ? collapse() : expand());
        $("#moreBtn").onclick = (e) => {
          e.stopPropagation();
          expand();
        };
        $("#closeBtn").onclick = (e) => {
          e.stopPropagation();
          collapse();
        };
        $("#replay").onclick = () => {
          gsap.fromTo(
            island,
            { scale: 0.992 },
            { duration: 0.34 * M, scale: 1, ease: "back.out(1.7)" },
          );
          flashSheen();
          if (states[index].id === "dispatch") signalOnce();
        };

        island.addEventListener("dblclick", () => (isExpanded ? collapse() : expand()));

        addEventListener("keydown", (e) => {
          if (e.key === "ArrowRight" || e.key === "Enter") setState(index + 1);
          if (e.key === "ArrowLeft") setState(index - 1);
          if (e.key === " ") {
            e.preventDefault();
            isExpanded ? collapse() : expand();
          }
          if (e.key === "Escape") collapse();
        });

        addEventListener("resize", () => {
          const s = states[index];
          gsap.set(island, {
            width: Math.min(isExpanded ? 520 : s.width, innerWidth - 32),
            height: isExpanded ? 164 : 62,
          });
        });

        setState(0);
      })();
    </script>
  </body>
</html>
