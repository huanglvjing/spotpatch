</g><text x="116" y="70" font-size="25" font-weight="650" fill="#edf0fa">SpotPatch</text><text x="64" y="184" font-size="13" font-weight="650" fill="#bda4f1">PRODUCT UI / 规范重绘</text><text x="64" y="271" font-size="47" font-weight="650" fill="#edf0fa">组件与接口，</text><text x="64" y="336" font-size="47" font-weight="650" fill="#edf0fa">关系有据可循。</text><text x="64" y="397" font-size="18" font-weight="400" fill="#9ea7bd">数据链路 Beta，只表达能证明的关系。</text><text x="64" y="494" font-size="14" font-weight="650" fill="#b699f3">01</text><text x="108" y="494" font-size="19" font-weight="400" fill="#d4d9e8">统一边距与清晰的内容层级</text><text x="64" y="542" font-size="14" font-weight="650" fill="#b699f3">02</text><text x="108" y="542" font-size="19" font-weight="400" fill="#d4d9e8">保留源码位置与当前目标</text><text x="64" y="590" font-size="14" font-weight="650" fill="#b699f3">03</text><text x="108" y="590" font-size="19" font-weight="400" fill="#d4d9e8">明确下一步，不堆叠装饰信息</text><rect x="62" y="679" width="522" height="90" rx="16" fill="#1c1c2d" stroke="#37304b"/><text x="84" y="713" font-size="14" font-weight="550" fill="#baace2">设计展示 / 示例内容</text><text x="84" y="743" font-size="14" font-weight="400" fill="#959fb6">按当前功能重绘，非运行截图或执行证据。</text><g filter="url(#shadow)"><rect x="810" y="173" width="500" height="646" rx="24" fill="url(#glass)" stroke="#555364"/></g><g transform="translate(831 195)"><svg
