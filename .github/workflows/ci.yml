name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20.19.0, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm test:compatibility

  e2e:
    name: Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: 22
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:performance
      - run: pnpm test:e2e:chromium
      - run: pnpm test:production-leakage
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  next-loader-poc:
    name: Next Loader POC (Ubuntu, Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: 22
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:next-poc
      - name: Upload Next Loader POC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-loader-poc-${{ github.run_id }}
          path: experiments/next-adapter/.artifacts/loader-poc/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  package:
    name: Package validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: 22
      - run: pnpm package:validate
